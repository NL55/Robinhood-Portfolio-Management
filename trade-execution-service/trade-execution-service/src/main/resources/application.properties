
# ==========================================
# ROBINHOOD - TRADE EXECUTION SERVICE
# ==========================================

# Application Configuration
spring.application.name=trade-execution-service
server.port=${SERVER_PORT:8082}

# ==========================================
# POSTGRESQL DATABASE CONFIGURATION
# ==========================================

# Local Windows: localhost:5433
# Docker / AWS EC2: postgres-trading:5432

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tradingdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================

# Development only; use database migrations
# and validate in production
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# SPRING BOOT ACTUATOR CONFIGURATION
# ==========================================

# Expose health and info endpoints
management.endpoints.web.exposure.include=health,info

# Enable health endpoint
management.endpoint.health.enabled=true

# Do not expose detailed health information
management.endpoint.health.show-details=never

# Enable database health checks
management.health.db.enabled=true

# ==========================================
# LOGGING CONFIGURATION
# ==========================================

logging.level.com.robinhood=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.boot.actuate=INFO
