
name: Robinhood CD - Deploy to EC2

# ==========================================
# AUTOMATIC + MANUAL DEPLOYMENT
# ==========================================
on:
  workflow_run:
    workflows:
      - Robinhood CI Pipeline
    types:
      - completed
    branches:
      - feature-branch

  workflow_dispatch:

permissions:
  contents: read

# Prevent two deployments running together
concurrency:
  group: robinhood-ec2-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Robinhood to AWS EC2

    # Deploy only after successful CI,
    # or when manually triggered.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:

      # =====================================
      # STEP 1 - CHECKOUT EXACT COMMIT
      # =====================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Verify deployment commit
        run: |
          set -euo pipefail

          ACTUAL_SHA=$(git rev-parse HEAD)

          if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
            echo "ERROR: Commit mismatch"
            exit 1
          fi

          echo "Deploying commit: $DEPLOY_SHA"

      # =====================================
      # STEP 2 - BUILD USER SERVICE
      # =====================================
      - name: Build User Service
        run: |
          docker build \
            -t robinhood-user-service:latest \
            ./user-service

      # =====================================
      # STEP 3 - BUILD TRADE SERVICE
      # =====================================
      - name: Build Trade Service
        run: |
          docker build \
            -t robinhood-trade-service:latest \
            ./trade-execution-service/trade-execution-service

      # =====================================
      # STEP 4 - BUILD REACT FRONTEND
      # =====================================
      - name: Build React Frontend
        run: |
          docker build \
            -t robinhood-frontend:latest \
            ./frontend

      # =====================================
      # STEP 5 - PACKAGE DOCKER IMAGES
      # =====================================
      - name: Package Docker images
        run: |
          set -euo pipefail

          docker save \
            robinhood-user-service:latest \
            robinhood-trade-service:latest \
            robinhood-frontend:latest \
            | gzip -1 > robinhood-images.tar.gz

          echo "Docker image archive created:"
          ls -lh robinhood-images.tar.gz

      # =====================================
      # STEP 6 - CONFIGURE SECURE SSH
      # =====================================
      - name: Configure secure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_HOST_FINGERPRINT: ${{ secrets.EC2_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan \
            -T 10 \
            -t ed25519 \
            "$EC2_HOST" \
            > ~/.ssh/known_hosts 2>/dev/null

          test -s ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          ACTUAL_FINGERPRINT=$(
            ssh-keygen \
              -lf ~/.ssh/known_hosts \
              -E sha256 |
              awk 'NR==1 {print $2}'
          )

          EXPECTED_FINGERPRINT=$(
            printf '%s' "$EC2_HOST_FINGERPRINT" |
            tr -d '\r\n '
          )

          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "ERROR: EC2 host fingerprint mismatch"
            exit 1
          fi

          echo "EC2 SSH host fingerprint verified"

      # =====================================
      # STEP 7 - TRANSFER IMAGES TO EC2
      # =====================================
      - name: Transfer images to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            robinhood-images.tar.gz \
            "$EC2_USER@$EC2_HOST:~/robinhood-images.tar.gz"

          echo "Docker images transferred to EC2"

      # =====================================
      # STEP 8 - DEPLOY ON AWS EC2
      # =====================================
      - name: Deploy Docker containers
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "DEPLOY_SHA=$DEPLOY_SHA bash -se" <<'REMOTE'

          set -euo pipefail

          # Remove transferred archive on exit
          trap 'rm -f ~/robinhood-images.tar.gz' EXIT

          cd ~/Robinhood-Portfolio-Management

          echo "================================="
          echo "Updating deployment source"
          echo "================================="

          # Protect local tracked file changes
          git diff --quiet
          git diff --cached --quiet

          git fetch origin feature-branch

          # Use the exact commit that passed CI
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          git checkout --detach "$DEPLOY_SHA"

          echo "================================="
          echo "Loading Docker images"
          echo "================================="

          docker load -i ~/robinhood-images.tar.gz

          echo "================================="
          echo "Updating Docker containers"
          echo "================================="

          docker compose config --quiet

          docker compose up -d \
            --no-build \
            --no-deps \
            --force-recreate \
            user-service \
            trade-execution-service \
            frontend

          # =================================
          # STEP 9 - HEALTH CHECK FUNCTION
          # =================================
          check_health() {
            name="$1"
            url="$2"

            echo "Checking $name..."

            for attempt in $(seq 1 24); do

              if curl \
                --fail \
                --silent \
                --max-time 5 \
                "$url" > /dev/null; then

                echo "SUCCESS: $name is healthy"
                return 0
              fi

              echo "$name not ready ($attempt/24)"
              sleep 5

            done

            echo "ERROR: $name failed health check"
            return 1
          }

          # =================================
          # STEP 10 - VERIFY MICROSERVICES
          # =================================
          check_health \
            "User Service" \
            "http://localhost:8081/actuator/health"

          check_health \
            "Trade Execution Service" \
            "http://localhost:8082/actuator/health"

          check_health \
            "React Frontend" \
            "http://localhost/"

          # =================================
          # STEP 11 - VERIFY CONTAINERS
          # =================================
          echo "================================="
          echo "Final Docker container status"
          echo "================================="

          docker compose ps

          echo "================================="
          echo "Deployed commit: $DEPLOY_SHA"
          echo "Robinhood deployment successful"
          echo "================================="

          REMOTE
